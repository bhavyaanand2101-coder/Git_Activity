name: Daily Commit

on:
  schedule:
    - cron: '30 6 * * *'  # 12:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update activity file
        run: |
          echo "Updated at: $(date)" >> activity.txt
          echo "Random: $RANDOM" >> activity.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.txt
          git commit -m "Daily update $(date)" || exit 0

      - name: Push changes
        run: git push
